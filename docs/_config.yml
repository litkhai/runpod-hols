title: Runpod Hands-On Labs
description: Serverless, Pods, Terraform — 실습 중심 Runpod 랩 모음 (EN/KO)
lang: en

# Served at https://litkhai.github.io/runpod-hols
baseurl: "/runpod-hols"
url: "https://litkhai.github.io"

repo_url: https://github.com/litkhai/runpod-hols

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false

# No remote theme on purpose — a self-contained layout has no upstream
# gem-compatibility risk and gives full control over the bilingual toggle.
# 원격 테마를 쓰지 않는다. 자체 레이아웃은 gem 호환성 문제가 없고
# 이중 언어 토글을 완전히 제어할 수 있다.
theme: null
plugins: []

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor

# Nav, grouped. A divider is drawn wherever `group` changes, which keeps the
# three kinds of page from reading as one flat list. Labels are English only —
# the page content is what the language toggle switches, not the chrome.
#
# 그룹으로 나눈 네비게이션. `group` 이 바뀌는 지점마다 구분선이 그려져,
# 성격이 다른 세 종류의 페이지가 하나의 평평한 목록으로 읽히지 않게 한다.
# 라벨은 영문만 사용한다. 언어 토글이 바꾸는 것은 페이지 본문이지 UI 가 아니다.
# Display names for the nav groups, used as sidebar headings.
# 사이드바 제목으로 쓰이는 그룹 표시 이름.
nav_groups:
  start: Start
  products: Compute products
  iac: Infrastructure as code
  reference: Reference

nav:
  # Start here / 시작
  - { title: Overview, url: /, group: start }
  - { title: Setup, url: /setup/, group: start }

  # One per compute product / 컴퓨트 제품별
  - { title: Serverless, url: /serverless/, group: products }
  - { title: Pod, url: /pod/, group: products }
  - { title: Cluster, url: /cluster/, group: products }

  # Not a fourth product — a way to provision the three above.
  # 네 번째 제품이 아니라, 위 세 가지를 프로비저닝하는 방식.
  - { title: Terraform, url: /terraform/, group: iac }

  # Reference / 레퍼런스
  - { title: SDK, url: /sdk/, group: reference }
  - { title: Handler, url: /handler/, group: reference }
