# Build and deploy the docs/ site to GitHub Pages.
# docs/ 사이트를 GitHub Pages 로 빌드해 배포한다.
#
# Pages source must be set to "GitHub Actions" in Settings → Pages.
# Settings → Pages 에서 소스를 "GitHub Actions" 로 설정해야 한다.
name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  # Allow running by hand from the Actions tab.
  # Actions 탭에서 수동 실행 허용.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-flight.
# 실행 중인 배포는 취소하지 않고 끝까지 진행시킨다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
