name: checks

# Solo repository: checks run on pull requests (and by hand), not again on the
# push to main that merging a PR produces. The pre-commit hook covers direct pushes.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: docs conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bilingual parity, fences, tables, nav, internal links, tracked secrets
        run: python3 scripts/check-docs.py -v

  syntax:
    name: shell / python / yaml / json syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse-check tracked files
        run: ./.github/scripts/check_syntax.sh

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  hygiene:
    name: repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No tracked file may match an ignore rule
        # gitignore does not apply to already-tracked files, so a rule added
        # after the fact is silently inert. Catch that instead of trusting it.
        run: |
          fail=0
          while IFS= read -r f; do
            if git check-ignore --no-index -q "$f"; then
              echo "tracked but matches an ignore rule: $f"
              fail=1
            fi
          done < <(git ls-files)
          [ "$fail" -eq 0 ] && echo "OK: no tracked file is shadowed by an ignore rule"
          exit "$fail"
      - name: No infrastructure state committed
        # A saved plan is a zip with the whole tfstate inside it and slips past
        # a *.tfstate rule. Check content, not names.
        run: |
          fail=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            case "$(file -b --mime-type "$f")" in
              application/zip)
                echo "archive committed, may carry state: $f"; fail=1; continue;;
            esac
            if grep -qa '"terraform_version"' "$f" && grep -qa '"lineage"' "$f"; then
              echo "looks like terraform state: $f"; fail=1
            fi
          done < <(git ls-files -- ':!.github/*' ':!.githooks/*')
          [ "$fail" -eq 0 ] && echo "OK: no terraform state or archives tracked"
          exit "$fail"
      - name: No machine-specific absolute paths
        run: |
          if git grep -nIE -e '/Users/|/home/' -- ':!*.md' ':!.github/*' ':!.githooks/*'; then
            echo
            echo "Use paths derived from BASH_SOURCE or __file__ instead."
            exit 1
          fi
          echo "OK: no host home paths in code"
